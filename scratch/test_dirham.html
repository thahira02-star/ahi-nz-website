<!DOCTYPE html>
<html>
<head>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
  body {
    background-color: #102F58;
    color: #FFFFFF;
    font-family: 'Montserrat', sans-serif;
    padding: 50px;
    display: flex;
    gap: 40px;
    align-items: center;
  }
  .case-metric-block {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .case-metric-icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .case-metric-data {
    display: flex;
    flex-direction: column;
  }
  .case-metric-val {
    font-size: 28px;
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -0.01em;
    display: flex;
    align-items: center;
  }
  .case-metric-lbl {
    font-size: 13.5px;
    font-weight: 500;
    color: #94A3B8;
    margin-top: 4px;
  }
</style>
</head>
<body>

  <!-- Version 1: With Dirham Symbol in Icon and in Value -->
  <div class="case-metric-block">
    <div class="case-metric-icon-wrap" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <path d="M8.5 6.5h2.8c2.6 0 4.7 2.3 4.7 5.5s-2.1 5.5-4.7 5.5H8.5Z"></path>
        <path d="M6 10h12"></path>
        <path d="M6 14h12"></path>
      </svg>
    </div>
    <div class="case-metric-data">
      <span class="case-metric-val" aria-label="0 Dirhams">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:-1px; margin-right:3px;" aria-hidden="true">
          <path d="M6.5 4h4c4.2 0 7.5 3.5 7.5 8s-3.3 8-7.5 8h-4Z"></path>
          <path d="M3.5 9.5h17"></path>
          <path d="M3.5 14.5h17"></path>
        </svg>0
      </span>
      <span class="case-metric-lbl">Emergency Callout</span>
    </div>
  </div>

</body>
</html>
